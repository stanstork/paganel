# cargo-audit configuration (https://github.com/rustsec/rustsec/tree/main/cargo-audit)

[advisories]
ignore = [
    # RUSTSEC-2020-0140 - FALSE POSITIVE.
    # The advisory targets the crates.io crate named `model`. Our workspace has
    # a local path crate also named `model` (crates/model), which cargo-audit
    # matches purely by name+version. It is not the affected published crate.
    "RUSTSEC-2020-0140",

    # RUSTSEC-2026-0235 (rkyv 0.7.46) - NOT COMPILED.
    # rkyv is only an *optional* dependency of `rust_decimal`, whose `rkyv`
    # feature we never enable (`connectors` uses only `db-postgres`). It is
    # present in Cargo.lock but not in any build graph - `cargo tree -i rkyv
    # -e normal` prints nothing - so no Paganel binary links it. rust_decimal
    # pins rkyv to ^0.7, so it can't be bumped to the fixed 0.8.17 without an
    # upstream release. Revisit when rust_decimal moves to rkyv 0.8.
    "RUSTSEC-2026-0235",

    # RUSTSEC-2026-0381 (webpki-roots 0.26.11) - FALSE POSITIVE.
    # 0.26.11 is a semver-trick release that only re-exports webpki-roots v1
    # (`cargo tree -p webpki-roots@0.26.11` shows it depending on 1.0.10, the
    # fixed version), so the roots it hands out are the fixed set. It is pulled
    # in by ureq 2.x (engine-wasm), and no fixed 0.26 exists. The direct 1.x
    # entry is patched.
    "RUSTSEC-2026-0381",

    # RUSTSEC-2026-0391 (zstd 0.13.3), RUSTSEC-2026-0398 and RUSTSEC-2026-0403
    # (zstd-safe 7.2.4) - NOT REACHABLE / NO UPSTREAM FIX.
    # zstd is only pulled in by wasmtime's `cache` feature (engine-wasm), which
    # calls `encode_all`/`decode_all` on compiled-module files it wrote itself
    # under the wasmtime cache directory. 0403 is in `Seekable`, which is never
    # used; 0398 is in the allocator shim for wasm-targeted zstd builds, and we
    # build zstd natively. 0391 needs a planted legacy-format frame in the cache
    # directory, i.e. an attacker who already has local write access. Even
    # wasmtime 50.0.1 still requires zstd ^0.13, so no bump fixes it. Revisit
    # when wasmtime moves to zstd >=0.14.3.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
]
