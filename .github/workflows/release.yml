name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: write

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        name: ${{ matrix.target }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                      features: vendored-tls
                    - os: ubuntu-22.04-arm
                      target: aarch64-unknown-linux-gnu
                      features: vendored-tls
                    - os: macos-15
                      target: aarch64-apple-darwin
                      features: vendored-tls
                    - os: macos-15
                      target: x86_64-apple-darwin
                      features: vendored-tls
                      cross: true
                    # Windows native-tls uses SChannel, so nothing to vendor.
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      features: ""

        steps:
            - uses: actions/checkout@v4

            - name: Read the pinned toolchain
              id: rust
              shell: bash
              run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ steps.rust.outputs.channel }}
                  targets: ${{ matrix.target }}

            - name: Setup Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  cache-on-failure: true
                  key: release-${{ matrix.target }}

            - name: Check the tag matches the workspace version
              if: startsWith(github.ref, 'refs/tags/v')
              shell: bash
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  # Allow release candidates: v0.1.0-rc.1 releases version 0.1.0.
                  base="${tag%%-*}"
                  manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
                  if [ "$base" != "$manifest" ]; then
                      echo "tag $GITHUB_REF_NAME implies version $base, but Cargo.toml says $manifest" >&2
                      exit 1
                  fi

            - name: Build
              shell: bash
              run: |
                  args=(--release --locked -p cli --target "${{ matrix.target }}")
                  if [ -n "${{ matrix.features }}" ]; then
                      args+=(--features "${{ matrix.features }}")
                  fi
                  cargo build "${args[@]}"

            - name: Smoke-test the binary
              if: matrix.cross != true
              shell: bash
              run: |
                  bin="target/${{ matrix.target }}/release/pag"
                  if [ "${{ runner.os }}" = "Windows" ]; then
                      bin="$bin.exe"
                  fi
                  "$bin" --version
                  "$bin" plan --help > /dev/null
                  
            - name: Assert no dynamic OpenSSL (Linux)
              if: runner.os == 'Linux'
              run: |
                  if ldd "target/${{ matrix.target }}/release/pag" | grep -E "libssl|libcrypto"; then
                      echo "release binary links the host OpenSSL" >&2
                      exit 1
                  fi
                  ldd "target/${{ matrix.target }}/release/pag"

            - name: Package
              shell: bash
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                      version="dev"
                  else
                      version="${GITHUB_REF_NAME#v}"
                  fi
                  staging="pag-${version}-${{ matrix.target }}"
                  mkdir -p "$staging"
                  cp README.md LICENSE "$staging/"
                  if [ "${{ runner.os }}" = "Windows" ]; then
                      cp "target/${{ matrix.target }}/release/pag.exe" "$staging/"
                      7z a "$staging.zip" "$staging" > /dev/null
                      echo "ASSET=$staging.zip" >> "$GITHUB_ENV"
                  else
                      cp "target/${{ matrix.target }}/release/pag" "$staging/"
                      tar czf "$staging.tar.gz" "$staging"
                      echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
                  fi

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.target }}
                  path: ${{ env.ASSET }}
                  if-no-files-found: error

    smoke:
        # Runs against the packaged archive on a fresh runner, not the build tree.
        name: smoke ${{ matrix.target }}
        needs: build
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                    - os: ubuntu-22.04-arm
                      target: aarch64-unknown-linux-gnu
                    - os: macos-15
                      target: aarch64-apple-darwin
                    - os: macos-15-intel
                      target: x86_64-apple-darwin
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
        env:
            FIXTURES: crates/engine-wasm/src/tests/fixtures

        steps:
            - name: Isolate pag's home directory
              shell: bash
              run: |
                  home="$RUNNER_TEMP/pag-home"
                  posix="$home"; command -v cygpath > /dev/null && posix=$(cygpath -u "$home")
                  mkdir -p "$posix"
                  echo "HOME=$home" >> "$GITHUB_ENV"
                  # pag resolves its home with `dirs::home_dir()`, which on Windows
                  # asks the OS for the profile folder and ignores HOME/USERPROFILE.
                  # There it writes under the runner's real (disposable) profile;
                  # PAG_HOME is wherever the assertions below should look.
                  if command -v cygpath > /dev/null; then
                      profile=$(powershell -NoProfile -Command "[Environment]::GetFolderPath('UserProfile')" | tr -d '\r')
                      echo "PAG_HOME=$(cygpath -u "$profile")" >> "$GITHUB_ENV"
                  else
                      echo "PAG_HOME=$home" >> "$GITHUB_ENV"
                  fi

            - uses: actions/checkout@v4
              with:
                  sparse-checkout: |
                      .github/smoke
                      crates/engine-wasm/src/tests/fixtures

            - uses: actions/download-artifact@v4
              with:
                  name: ${{ matrix.target }}
                  path: dist

            - name: Unpack the archive like a user would
              shell: bash
              run: |
                  cd dist
                  if [ "${{ runner.os }}" = "Windows" ]; then
                      7z x -y pag-*-${{ matrix.target }}.zip > /dev/null
                      bin=pag.exe
                  else
                      tar xzf pag-*-${{ matrix.target }}.tar.gz
                      bin=pag
                  fi
                  dir=$(ls -d pag-*-${{ matrix.target }}/)
                  ls -l "$dir"
                  test -f "$dir/README.md"
                  test -f "$dir/LICENSE"
                  test -x "$dir/$bin"
                  echo "PAG=$PWD/$dir$bin" >> "$GITHUB_ENV"

            - name: Version and help
              shell: bash
              run: |
                  "$PAG" --version
                  "$PAG" plan   --help > /dev/null
                  "$PAG" apply  --help > /dev/null
                  "$PAG" verify --help > /dev/null

            - name: State store opens on this OS
              shell: bash
              run: |
                  out=$("$PAG" receipt --json)
                  echo "$out"
                  [ "$out" = "[]" ]
                  test -d "$PAG_HOME/.paganel/state"

            - name: Plugin runtime works on this OS
              shell: bash
              run: |
                  "$PAG" plugin inspect "$FIXTURES/test_transform.wasm"
                  "$PAG" plugin inspect "$FIXTURES/test_transform_js.wasm"

                  out=$("$PAG" plugin test "$FIXTURES/test_transform.wasm" --json \
                        --input '[{"a":2,"b":3},{"a":10,"b":1}]' | tr -d ' \n\r')
                  echo "$out"
                  # `values` are currently emitted as Debug strings ("Float(5.0)");
                  # match the numbers so this keeps passing once that is fixed.
                  case "$out" in
                      '{"values":['*5.0*11.0*']}') ;;
                      *) echo "unexpected transform output" >&2; exit 1 ;;
                  esac

                  out=$("$PAG" plugin test "$FIXTURES/test_filter.wasm" --mode filter --json \
                        --input '[{"value":10},{"value":-5}]' | tr -d ' \n\r')
                  echo "$out"
                  [ "$out" = '{"passes":[true,false]}' ]

                  "$PAG" plugin test "$FIXTURES/test_source.wasm" --mode source --json
                  "$PAG" plugin test "$FIXTURES/test_sink.wasm" --mode sink --json \
                        --input '[{"id":1},{"id":2}]'

            # ---- real migration against a local PostgreSQL --------------------

            - name: Start PostgreSQL (Linux)
              if: runner.os == 'Linux'
              run: |
                  command -v psql > /dev/null || sudo apt-get install -y -q postgresql
                  sudo systemctl start postgresql
                  sudo -u postgres psql -c "CREATE USER smoke WITH PASSWORD 'smoke' SUPERUSER"
                  sudo -u postgres psql -c "CREATE DATABASE smoke OWNER smoke"
                  echo "POSTGRES_URL=postgres://smoke:smoke@localhost:5432/smoke" >> "$GITHUB_ENV"

            - name: Start PostgreSQL (macOS)
              if: runner.os == 'macOS'
              run: |
                  brew install postgresql@16
                  prefix="$(brew --prefix postgresql@16)"
                  echo "$prefix/bin" >> "$GITHUB_PATH"
                  "$prefix/bin/pg_ctl" -D "$(brew --prefix)/var/postgresql@16" -l "$RUNNER_TEMP/pg.log" -w start
                  "$prefix/bin/createdb" smoke
                  echo "POSTGRES_URL=postgres://$USER@localhost:5432/smoke" >> "$GITHUB_ENV"

            - name: Start PostgreSQL (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  # The runner image ships PostgreSQL as a disabled service, with
                  # PGBIN set and the postgres superuser password "root".
                  $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
                  if (-not $svc) { throw "no PostgreSQL service on this image" }
                  Set-Service -Name $svc.Name -StartupType Manual
                  Start-Service -Name $svc.Name
                  $env:PGPASSWORD = 'root'
                  & "$env:PGBIN\psql" -U postgres -c "CREATE DATABASE smoke"
                  "$env:PGBIN" | Out-File -Append -FilePath $env:GITHUB_PATH
                  "POSTGRES_URL=postgres://postgres:root@localhost:5432/smoke" | Out-File -Append -FilePath $env:GITHUB_ENV

            - name: Migrate CSV -> PostgreSQL -> PostgreSQL, verify, tamper, verify
              shell: bash
              run: |
                  S1=.github/smoke/csv-to-postgres.ppl
                  S2=.github/smoke/pg-to-pg.ppl

                  expect() {
                      local needle="$1"; shift
                      local out; out=$("$@")
                      echo "$out"
                      echo "$out" | grep -q -- "$needle"
                  }

                  # Stage 1: CSV source, COPY write path, receipt, clean verify.
                  "$PAG" apply -c "$S1" --integrity
                  expect "match (5 rows" "$PAG" verify -c "$S1"

                  # Stage 2: plan, then keyset read + filter + computed column.
                  expect "Ready to apply" "$PAG" plan -c "$S2"
                  "$PAG" apply -c "$S2" --integrity
                  expect "match (4 rows" "$PAG" verify -c "$S2"

                  # Tamper one row on the destination; verify must fail and name it.
                  psql "$POSTGRES_URL" -c "UPDATE smoke_customers_copy SET tier = 'TAMPERED' WHERE id = 4"
                  if out=$("$PAG" verify -c "$S2"); then
                      echo "verify passed on a tampered table" >&2; exit 1
                  fi
                  echo "$out"
                  echo "$out" | grep -q "id=4 - changed"

                  # Both receipts are in the state store.
                  [ "$("$PAG" receipt --json | grep -c '"pipeline"')" = "2" ]

    release:
        name: Publish release
        needs: [build, smoke]
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/v')
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true

            - name: Checksums
              run: |
                  cd dist
                  sha256sum * > SHA256SUMS
                  cat SHA256SUMS

            - name: Create the release
              uses: softprops/action-gh-release@v2
              with:
                  files: dist/*
                  body_path: .github/release-intro.md
                  generate_release_notes: true
                  draft: true
