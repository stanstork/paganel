[workspace]
members = [
    "crates/model",
    "crates/ppl-syntax",
    "crates/query-builder",
    "crates/connectors",
    "crates/engine-core",
    "crates/engine-state",
    "crates/engine-infra",
    "crates/engine-config",
    "crates/engine-runtime",
    "crates/engine-processing",
    "crates/engine-tests",
    "crates/expression-engine",
    "crates/cli",
    "crates/engine-planner",
    "crates/engine-schema",
    "crates/engine-verify",
    "crates/engine-wasm",
    "crates/sdk/paganel-plugin-compiler",
]

exclude = [
    "crates/engine-wasm/src/tests/plugins/rust",
    "crates/sdk/paganel-plugin-sdk",
    "crates/sdk/paganel-plugin-sdk-macros",
    # WASM-only QuickJS runtime: built solely for wasm32-wasip1 (see
    # build_fixtures.sh) and committed as a fixture.
    "crates/sdk/paganel-plugin-js-runtime",
    # Benchmark transform/filter plugins: wasm32 cdylibs built by benchmarks/run.sh.
    "benchmarks/plugins/rust/order_net",
    "benchmarks/plugins/rust/order_ok",
]

resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/stanstork/paganel"
homepage = "https://github.com/stanstork/paganel"
description = "Declarative, crash-safe data and schema migration engine with cryptographic verification and WASM plugins."
keywords = ["database", "migration", "etl", "data-pipeline", "postgres"]
categories = ["database", "command-line-utilities"]
