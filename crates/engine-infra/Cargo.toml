[package]
name = "engine-infra"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
model = { path = "../model" }
engine-state = { path = "../engine-state" }

tokio = { version = "1.43.0", features = ["full"] }
chrono = { version = "0.4.39", features = ["serde"] }
serde = { version = "1.0.217", features = ["derive"] }
tracing = "0.1.41"
tokio-util = "0.7.17"
serde_json = "1.0.138"
ureq = "2.12"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1.43.0", features = ["full"] }
tempfile = "3.14.0"
